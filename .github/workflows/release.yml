name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v4.1.0). Used only for manual runs."
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cs-linux-x86_64
          - os: macos-13
            asset: cs-macos-x86_64
          - os: macos-latest
            asset: cs-macos-arm64
          - os: windows-latest
            asset: cs-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Selftest (fail fast before packaging)
        env:
          CS_NO_COLOR: "1"
        run: python cs.py selftest

      - name: Build binary
        run: pyinstaller cs.spec --noconfirm

      - name: Package + checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp dist/cs.exe "out/${{ matrix.asset }}"
          else
            cp dist/cs "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="out/${{ matrix.asset }}"
          "$BIN" --version
          "$BIN" selftest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
