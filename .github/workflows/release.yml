name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v4.2.0)."
        required: true
        default: "v4.2.0"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cs-linux-x86_64
          - os: macos-latest
            asset: cs-macos-arm64
          - os: windows-latest
            asset: cs-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller (+ computer-use libraries to bundle)
        run: python -m pip install --upgrade pip pyinstaller mss pyautogui pillow

      - name: Selftest (fail fast before packaging)
        env:
          CS_NO_COLOR: "1"
        run: python cs.py selftest

      - name: Build binary
        run: pyinstaller cs.spec --noconfirm

      - name: Package + checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp dist/cs.exe "out/${{ matrix.asset }}"
          else
            cp dist/cs "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="out/${{ matrix.asset }}"
          # The binary is portable: without CS_HOME it writes cs_data/ next to
          # itself, which would land in out/ and get published. Keep it elsewhere.
          export CS_HOME="$RUNNER_TEMP/cs-smoke"
          "$BIN" --version
          "$BIN" selftest
          # the bundled Studio app must serve its frontend from inside the exe
          "$BIN" studio --no-open --port 8799 &
          PID=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q 'name="cs-token"'
          curl -sf -o /dev/null http://127.0.0.1:8799/static/studio.js
          kill $PID || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          # only the binaries and their checksums are release assets
          find artifacts -type f -name 'cs-*' -exec cp {} release/ \;
          cd release
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la
          test "$(ls | wc -l)" -eq 4   # 3 binaries + SHA256SUMS.txt

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              if [ ! -f "release/$a" ]; then
                echo "deleting stale asset: $a"
                gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
