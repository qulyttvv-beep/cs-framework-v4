name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v4.3.0)."
        required: true
        default: "v4.3.0"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/package.yml

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          # the desktop app installers, the cs binaries and their checksums
          find artifacts -type f \( -name 'cs-*' -o -name 'SparkX-*' \) -exec cp {} release/ \;
          cd release
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la
          test "$(ls | wc -l)" -eq 6   # installer + dmg + 3 cs binaries + SHA256SUMS.txt

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              if [ ! -f "release/$a" ]; then
                echo "deleting stale asset: $a"
                gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Spark X ${{ steps.tag.outputs.name }}
          body: |
            ## Download

            | | |
            |---|---|
            | **Windows** | `SparkX-Setup-x64.exe`: installer, adds Spark X to the Start menu |
            | **macOS** (Apple silicon) | `SparkX-macOS-arm64.dmg`: open it and drag Spark X into Applications |
            | **Command line** | `cs-windows-x86_64.exe`, `cs-macos-arm64`, `cs-linux-x86_64`: the single-file `cs` tool (`cs studio` opens Spark X in your browser) |

            The installers aren't code-signed yet. On Windows, if SmartScreen stops the installer, click **More info → Run anyway**. On macOS, the first time you open the app, go to **System Settings → Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine "/Applications/Spark X.app"`.

            Checksums are in `SHA256SUMS.txt`.
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
