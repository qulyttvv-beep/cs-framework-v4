name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -c "import ast, sys; ast.parse(open('cs.py', encoding='utf-8').read()); print('cs.py parses OK')"

      - name: Built-in selftest
        env:
          CS_NO_COLOR: "1"
        run: python cs.py selftest

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        env:
          CS_NO_COLOR: "1"
        run: python -m pytest -ra -v --durations=10

  package:
    # builds + runs the installers (Windows setup, macOS .dmg) and cs binaries
    if: github.event_name != 'push'
    uses: ./.github/workflows/package.yml
