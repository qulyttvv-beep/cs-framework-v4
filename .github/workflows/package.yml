name: Package

# Builds and tests everything that ships: the single-file cs binaries (all
# platforms), the Windows installer and the macOS app. Called by the Release
# workflow, and by CI on pull requests so packaging breaks show up before a
# release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cs-linux-x86_64
          - os: macos-latest
            asset: cs-macos-arm64
            app: SparkX-macOS-arm64.dmg
          - os: windows-latest
            asset: cs-windows-x86_64.exe
            app: SparkX-Setup-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller (+ computer-use libraries to bundle)
        run: python -m pip install --upgrade pip pyinstaller==6.22.3 mss pyautogui pillow

      - name: Install pywebview (the desktop app's native window)
        if: matrix.app
        run: python -m pip install pywebview==6.2.1

      - name: Selftest (fail fast before packaging)
        env:
          CS_NO_COLOR: "1"
        run: python cs.py selftest

      - name: Build the cs binary
        run: pyinstaller cs.spec --noconfirm

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp dist/cs.exe "out/${{ matrix.asset }}"
          else
            cp dist/cs "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="out/${{ matrix.asset }}"
          # The binary is portable: without CS_HOME it writes cs_data/ next to
          # itself, which would land in out/ and get published. Keep it elsewhere.
          export CS_HOME="$RUNNER_TEMP/cs-smoke"
          "$BIN" --version
          "$BIN" selftest
          # the bundled app must serve its frontend from inside the exe
          "$BIN" studio --no-open --port 8799 &
          PID=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q 'name="cs-token"'
          curl -sf -o /dev/null http://127.0.0.1:8799/static/studio.js
          kill $PID || true

      - name: Build the desktop app
        if: matrix.app
        run: pyinstaller sparkx.spec --noconfirm

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path cs.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\sparkx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "out\${{ matrix.app }}")) { throw "installer not built" }

      - name: Install and run the desktop app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\SparkX"
          $setup = (Resolve-Path "out\${{ matrix.app }}").Path
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          foreach ($f in "Spark X.exe","cs.exe","INSTALLED","unins000.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          & "$dir\cs.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "cs.exe --version failed" }
          # the real app: native window (WebView2) → loads the UI → reports ready
          $env:SPARKX_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.json"
          $env:SPARKX_OFFLINE = "1"
          $g = Start-Process -FilePath "$dir\Spark X.exe" -ArgumentList "--smoke","--port","8811" -PassThru
          $null = $g.Handle
          if (-not $g.WaitForExit(300000)) { $g.Kill(); throw "the app didn't finish its smoke test" }
          if (Test-Path $env:SPARKX_SMOKE_OUT) { Get-Content $env:SPARKX_SMOKE_OUT }
          if (Test-Path "$env:APPDATA\Spark X\logs\spark-x.log") { Get-Content "$env:APPDATA\Spark X\logs\spark-x.log" -Tail 40 }
          if ($g.ExitCode -ne 0) { throw "native window smoke test failed (exit $($g.ExitCode))" }
          # and it uninstalls cleanly
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Spark X.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Spark X.exe") { throw "uninstall left the app behind" }

      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dmgroot
          cp -R "dist/Spark X.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Spark X" -srcfolder dmgroot -ov -format UDZO "out/${{ matrix.app }}"
          codesign --verify --deep --strict "dist/Spark X.app" && echo "bundle signature ok" \
            || echo "::warning::codesign --verify failed for Spark X.app"

      - name: Run the desktop app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export SPARKX_SMOKE_OUT="$RUNNER_TEMP/smoke.json" SPARKX_OFFLINE=1
          # run the copy inside the disk image, exactly as users get it
          MNT="$RUNNER_TEMP/sparkx-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "out/${{ matrix.app }}"
          code=0
          "$MNT/Spark X.app/Contents/MacOS/Spark X" --smoke --port 8811 || code=$?
          cat "$SPARKX_SMOKE_OUT" || true
          tail -n 40 "$HOME/Library/Application Support/Spark X/logs/spark-x.log" || true
          hdiutil detach "$MNT" || true
          exit $code

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          for f in "${{ matrix.asset }}" ${{ matrix.app }}; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256
            out/SparkX-*
          if-no-files-found: error
          retention-days: 7
